[package]
name = "fandhe-example"
version = "0.1.0"
edition = "2021"
description = "fandhe-multi-platform を外から使う最小アプリ（5 機能: カメラ撮影・書類スキャン・NFC カードエミュレーション・共有の受け取り・ホームウィジェット）"
license = "MIT OR Apache-2.0"
publish = false

# Android は cdylib（`#[fandhe::main]` が生成する `android_main`）、iOS・デスクトップは bin。
[lib]
name = "fandhe_example"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fandhe-example"
path = "src/main.rs"

# `cargo fandhe gen` の入力。説明文は利用者（このアプリ）が書く。
[package.metadata.fandhe-app]
app-group-prefix = "com.fandhe"

[package.metadata.fandhe-app.ios]
bundle-id = "com.fandhe.example"

[package.metadata.fandhe-app.ios.usage-descriptions]
NSCameraUsageDescription = "カメラ撮影と書類スキャンの動作確認に使います"

[dependencies]
# 入口 crate。使う端末機能を feature（対応表の id）で選ぶ。各 OS の入口（`#[fandhe::main]`）と、
# 選んだ機能の起動前の登録・終了処理もここから入る。
fandhe = { git = "https://github.com/Fandhe-AI/fandhe-multi-platform", rev = "fad65c82a8a763a996d045911a4d3eb0165eec46", features = [
    "camera-capture",
    "document-scan",
    "nfc-card-emulation",
    "share-receive",
    "home-widget",
] }

# 本体の型サンプル画面（`fandhe::screens`）を動かす effect ドライバ（`fandhe_cap_<stem>::driver`）。
# ドライバは入口 crate から再公開されない（契約だけを出す設計）ため、画面を借りるこのアプリは機能 crate にも直接依存する。
# 自前の画面を書くアプリは `fandhe::<stem>::platform_<stem>()` などの契約だけで足り、ここは要らない。全 crate を同じ rev に揃える。
fandhe-cap-camera-capture = { git = "https://github.com/Fandhe-AI/fandhe-multi-platform", rev = "fad65c82a8a763a996d045911a4d3eb0165eec46" }
fandhe-cap-document-scan = { git = "https://github.com/Fandhe-AI/fandhe-multi-platform", rev = "fad65c82a8a763a996d045911a4d3eb0165eec46" }
fandhe-cap-nfc-card-emulation = { git = "https://github.com/Fandhe-AI/fandhe-multi-platform", rev = "fad65c82a8a763a996d045911a4d3eb0165eec46" }
fandhe-cap-share-receive = { git = "https://github.com/Fandhe-AI/fandhe-multi-platform", rev = "fad65c82a8a763a996d045911a4d3eb0165eec46" }
fandhe-cap-home-widget = { git = "https://github.com/Fandhe-AI/fandhe-multi-platform", rev = "fad65c82a8a763a996d045911a4d3eb0165eec46" }
